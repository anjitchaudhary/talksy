name: talksy
description: "A messaging application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.17.2
  image_picker: ^1.2.3
  http: ^1.6.0
  intl: ^0.20.3
  mailer: ^7.2.0
  foundation: ^0.0.5
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter:
  assets:
   - .env
   - assets/icon/icon.png
  uses-material-design: true
